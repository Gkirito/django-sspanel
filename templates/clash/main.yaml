# see https://github.com/Loyalsoldier/clash-rules
mode: rule
port: 7890
socks-port: 7891
allow-lan: true
log-level: info
find-process-mode: always
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  listen: 0.0.0.0:1053
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
    - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
  # fake-ip-ttl: 1
  nameserver-policy:
    '+.arpa': '10.0.0.1'
    'rule-set:cn':
    - '114.114.114.114'
    - https://doh.pub/dns-query
    - https://120.53.53.53/dns-query
    - https://1.12.12.12/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://dns.twnic.tw/dns-query
    - quic://223.5.5.5
    - quic://223.6.6.6
    - https://120.53.53.53/dns-query
    - https://1.12.12.12/dns-query
    - https://dns.ipv6dns.com/dns-query
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - tls://8.8.4.4
    - tls://1.1.1.1
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
proxy-groups:
  - name: 🌏PROXY
    type: select
    proxies:
      - ✈️ AutoBest
      - 🇭🇰HK-LB
      - 🇹🇼TW-LB
      - 🇯🇵JP-LB
      - 🇺🇸US-LB
      - DIRECT
    use:
      - {{ provider_name }}-all

  - name: 🗼Telegram
    type: select
    proxies:
      - 🌏PROXY
      - 🇭🇰HK-LB
      - 🇹🇼TW-LB
      - 🇯🇵JP-LB
      - 🇺🇸US-LB
      - ✈️ AutoBest
      - DIRECT

  - name: 🍎Apple
    type: select
    proxies:
      - DIRECT
      - 🌏PROXY
      - 🇭🇰HK-LB
      - 🇹🇼TW-LB
      - 🇯🇵JP-LB
      - 🇺🇸US-LB
      - ✈️ AutoBest

  - name: 🤖AI-LB
    type: load-balance
    strategy: consistent-hashing
    filter: "AI"
    use:
      - {{ provider_name }}-all

  - name: 🎬GlobalMedia-LB
    type: select
    strategy: consistent-hashing
    filter: "Netflix"
    use:
      - {{ provider_name }}-all

  - name: ✈️ AutoBest
    type: url-test
    interval: 300
    use:
      - {{ provider_name }}-all

  - name: 🇭🇰HK-LB
    type: load-balance
    strategy: consistent-hashing
    filter: "香港|hk|HK"
    use:
      - {{ provider_name }}-all

  - name: 🇹🇼TW-LB
    type: load-balance
    strategy: consistent-hashing
    filter: "台湾|tw|TW"
    use:
      - {{ provider_name }}-all

  - name: 🇯🇵JP-LB
    type: load-balance
    strategy: consistent-hashing
    filter: "日本|jp|JP"
    use:
      - {{ provider_name }}-all

  - name: 🇺🇸US-LB
    type: load-balance
    strategy: consistent-hashing
    filter: "美国|us|US"
    use:
      - {{ provider_name }}-all

  - name: 🚄SpeedTest
    type: select
    proxies:
      - DIRECT
    use:
      - {{ provider_name }}-all

  - name: 🕸️Final
    type: select
    proxies:
      - DIRECT
      - 🇭🇰HK-LB
      - 🇹🇼TW-LB
      - 🇯🇵JP-LB
      - 🇺🇸US-LB
      - 🌏PROXY

  - name: 🛡️Guard
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 🌏PROXY

proxy-providers:
  {{ provider_name }}-all:
    type: http
    url: {{ all_proxy_provider_url|safe }}
    interval: 3600
    path: ./providers/{{ provider_name }}-all.yaml
    health-check:
      enable: true
      interval: 300
      tolerance: 150
      lazy: true
      url: http://www.gstatic.com/generate_204

